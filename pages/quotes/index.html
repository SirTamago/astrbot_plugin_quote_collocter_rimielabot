<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>群友语录 · 管理</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>群友语录 · 管理</h1>
      <p class="subtitle">按群浏览语录，直接在表格里改星级、批量调整或删除</p>
    </header>

    <main>
      <section class="card">
        <h2>筛选</h2>
        <div class="toolbar">
          <label>
            <span>群号</span>
            <input id="groupId" type="text" placeholder="例如 123456789" />
          </label>
          <label>
            <span>星级</span>
            <select id="rarityFilter"></select>
          </label>
          <label>
            <span>关键词</span>
            <input id="query" type="text" placeholder="标题或文件名" />
          </label>
          <label>
            <span>每页</span>
            <select id="pageSize">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
          <button id="load">查询</button>
          <span id="msg" class="msg"></span>
        </div>
        <p class="hint" id="rateHint"></p>
      </section>

      <section class="card">
        <div class="bulk">
          <label class="check"><input type="checkbox" id="selectAll" /> 全选本页</label>
          <span id="selectedCount" class="muted">已选 0 张</span>
          <span class="sep"></span>
          <label>
            <span>设为</span>
            <select id="bulkRarity"></select>
          </label>
          <button id="applySelected">应用到选中</button>
          <button id="applyFiltered">当前筛选全部设为该档</button>
          <button id="deleteSelected" class="danger">删除选中</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-check"></th>
                <th class="col-thumb">预览</th>
                <th>标题</th>
                <th class="col-rarity">星级</th>
                <th>投稿人</th>
                <th>投稿时间</th>
                <th class="col-size">大小</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td colspan="8" class="empty">填写群号后点「查询」</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="pager">
          <button id="prev">上一页</button>
          <span id="pageInfo">-</span>
          <button id="next">下一页</button>
          <span id="totalInfo" class="muted"></span>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
